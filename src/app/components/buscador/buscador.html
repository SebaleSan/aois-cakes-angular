
<button class="btn btn-lupa" (click)="abrir()">
  <i class="fas fa-search"></i>
</button>


<div class="busqueda-overlay" *ngIf="panelAbierto" (click)="cerrar()">
  <div class="busqueda-panel" (click)="$event.stopPropagation()">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="h5 mb-0">Buscar productos</h2>
      <button class="btn btn-close" (click)="cerrar()"></button>
    </div>

    <input
      type="text"
      class="form-control form-control-lg mb-3"
      placeholder="Nombre, descripción, categoría..."
      [(ngModel)]="busqueda"
      (keyup.enter)="buscar()">

    <select class="form-select mb-4" [(ngModel)]="categoriaSeleccionada">
      <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
    </select>

    <button class="btn w-100 main-btn" (click)="buscar()">
      Buscar
    </button>

  </div>
</div>
