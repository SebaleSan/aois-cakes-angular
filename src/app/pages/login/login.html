<main class="page-animation py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="registro-card">

          <div class="text-center mb-4">
            <img src="assets/img/logoAois.png" alt="Aoi's Cakes" class="registro-logo mb-3">
            <h1 class="registro-titulo">Iniciar sesión</h1>
            <p class="text-muted">Bienvenido/a de vuelta</p>
          </div>

          <div class="alert rounded-3"
            *ngIf="mensaje"
            [class.alert-success]="tipoMensaje === 'success'"
            [class.alert-danger]="tipoMensaje === 'danger'">
            {{ mensaje }}
          </div>

          <form [formGroup]="form" (ngSubmit)="ingresar()">

            <div class="mb-3">
              <label for="correo" class="form-label registro-label">Correo electrónico</label>
              <input id="correo" type="email" class="form-control registro-input"
                placeholder="correo@ejemplo.cl"
                formControlName="correo"
                [class.is-invalid]="correo?.invalid && correo?.touched">
              <div class="invalid-feedback">
                <span *ngIf="correo?.errors?.['required']">El correo es obligatorio.</span>
                <span *ngIf="correo?.errors?.['email']">Ingresa un correo válido.</span>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label registro-label">Contraseña</label>
              <input id="password" type="password" class="form-control registro-input"
                placeholder="Tu contraseña"
                formControlName="password"
                [class.is-invalid]="password?.invalid && password?.touched">
              <div class="invalid-feedback">
                <span *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</span>
              </div>
            </div>

            <div class="d-grid gap-2 mb-3">
              <button type="submit" class="btn registro-btn-primary">Ingresar</button>
            </div>

          </form>

          <div class="d-grid gap-2 mb-3">
            <button type="button" class="btn registro-btn-secondary" (click)="usarDemo('cliente')">
              Usar cuenta demo cliente
            </button>
            <button type="button" class="btn registro-btn-secondary" (click)="usarDemo('admin')">
              Usar cuenta demo admin
            </button>
          </div>

          <hr class="registro-divider">

          <p class="text-center mb-0">
            ¿No tienes cuenta?
            <a routerLink="/registro" class="registro-link">Regístrate</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</main>
