<main class="page-animation py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="registro-card">

          <div class="text-center mb-4">
            <img src="assets/img/logoAois.png" alt="Aoi's Cakes" class="registro-logo mb-3">
            <h1 class="registro-titulo">Recuperar contraseña</h1>
            <p class="text-muted">
              Ingresa tu correo y te generaremos una contraseña temporal.
            </p>
          </div>

          <div class="alert rounded-3" *ngIf="mensaje"
            [class.alert-success]="tipoMensaje === 'success'"
            [class.alert-danger]="tipoMensaje === 'danger'">
            {{ mensaje }}
          </div>

          <form [formGroup]="form" (ngSubmit)="recuperar()" *ngIf="!enviado">

            <div class="mb-4">
              <label for="correo" class="form-label registro-label">Correo electrónico</label>
              <input id="correo" type="email" class="form-control registro-input"
                placeholder="correo@ejemplo.cl"
                formControlName="correo"
                [class.is-invalid]="correo?.invalid && correo?.touched">
              <div class="invalid-feedback">
                <span *ngIf="correo?.errors?.['required']">El correo es obligatorio.</span>
                <span *ngIf="correo?.errors?.['email']">Ingresa un correo válido.</span>
              </div>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn registro-btn-primary">
                Recuperar contraseña
              </button>
            </div>

          </form>

          
          <div *ngIf="enviado" class="text-center">
            <div class="d-grid mb-3">
              <a routerLink="/login" class="btn registro-btn-primary">
                Ir al login
              </a>
            </div>
          </div>

          <hr class="registro-divider">

          <p class="text-center mb-0">
            <a routerLink="/login" class="registro-link">Volver al login</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</main>
