<main class="animar container py-5">

  <section class="text-center mb-1">
    <h1>Catálogo</h1>
    <p class="lead text-muted">Descubre nuestras especialidades</p>
  </section>

  <section class="shadow mb-1 borde">
    <div class="card-body">
      <h2 class="h5 mb-4">Filtrar productos</h2>

      <div class="row g-3 align-items-end">

        <div class="col-12 col-lg-5">
          <label for="busqueda" class="form-label">Buscar</label>
          <input
            id="busqueda"
            type="text"
            class="form-control"
            placeholder="Nombre, categoría o descripción..."
            [(ngModel)]="busqueda">
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <label for="categoria" class="form-label">Categoría</label>
          <select
            id="categoria"
            class="form-select"
            [(ngModel)]="categoriaSeleccionada">
            <option *ngFor="let cat of categorias" [value]="cat">
              {{ cat }}
            </option>
          </select>
        </div>

        <div class="col-12 col-md-6 col-lg-2">
          <div class="form-check mt-4">
            <input
              id="disponibles"
              type="checkbox"
              class="form-check-input"
              [(ngModel)]="mostrarSoloDisponibles">
            <label for="disponibles" class="form-check-label">
              Solo disponibles
            </label>
          </div>
        </div>

        <div class="col-12 col-lg-2">
          <button
            type="button"
            class="btn btn-outline-dark w-100"
            (click)="limpiarFiltros()">
            Limpiar
          </button>
        </div>

      </div>
    </div>
  </section>

  <section class="mb-3">
    <p class="mb-0">
      Resultados: <strong>{{ productosFiltrados.length }}</strong>
    </p>
  </section>

  <section class="row g-4 justify-content-center" *ngIf="productosFiltrados.length > 0; else sinProductos">
    <article class="col-12 col-md-6 col-lg-3" *ngFor="let producto of productosFiltrados">
      <a [routerLink]="['/detalle', producto.id]" class="text-decoration-none">
        <div class="card catalog h-100 rounded-4 overflow-hidden shadow-sm border-0">
          <img
            [src]="producto.imagen"
            [alt]="producto.nombre"
            class="card-img-top"
            style="height: 200px; object-fit: cover;"
          />
          <div class="card-body catalog-content d-flex flex-column justify-content-between">
            <span class="categoria text-uppercase small fw-bold text-muted mb-1">{{ producto.categoria }}</span>
            <h3 class="card-title h5 mb-2">{{ producto.nombre }}</h3>
            <p class="card-text text-secondary small mb-3 flex-grow-1">{{ producto.descripcion }}</p>
            <div class="d-flex justify-content-between align-items-center">
              <p class="fw-bold fs-4 text-dark">{{ formatearPrecio(producto.precio) }}</p>
              <span *ngIf="producto.disponible" class="badge bg-success rounded-pill px-3 py-2 small">Disponible</span>
            </div>
          </div>
        </div>
      </a>
    </article>
  </section>

  <ng-template #sinProductos>
    <div class="alert alert-warning text-center">
      No se encontraron productos con los filtros seleccionados.
    </div>
  </ng-template>

</main>
